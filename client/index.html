    <script>
      (function () {
        try {
          var theme = localStorage.getItem('bcode-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var raw = localStorage.getItem('bcode-appearance');
          if (!raw) return;
          var data = JSON.parse(raw);
          var palette = data && data.palette;
          if (!palette) return;
          var tones = theme === 'light' ? palette.light : palette.dark;
          var accent = (tones && tones.accent) || (palette.dark && palette.dark.accent);
          if (!accent) return;
          var root = document.documentElement;
          root.style.setProperty('--c-accent', accent);
          root.style.setProperty('--c-accent-soft', accent);
          if (data.btn) root.style.setProperty('--c-accent-btn', data.btn);
          if (data.on) root.style.setProperty('--c-on-accent', data.on);
          if (palette.id) root.setAttribute('data-palette', palette.id);
        } catch (e) {}
      })();
    </script>
